# Pimax Crystal Super on Monado pimax-p3c (custom build).
# Envision's General tab only writes these for a *system profile* install, so the
# custom build carries them explicitly. Values mirror GlobalPreferences::get_env_vars
# (envision src/config.rs), tuned for this headset. Revert = delete this file, re-login.

# --- Envision "General" tab equivalents ---
XRT_COMPOSITOR_SCALE_PERCENTAGE=100
XRT_COMPOSITOR_COMPUTE=1
U_PACING_APP_USE_MIN_FRAME_PERIOD=0
XRT_DEBUG_GUI=0
XRT_CURATED_GUI=0
ORT_DISABLE_TELEMETRY=1
# Envision "Nvidia mitigation"
U_PACING_COMP_TIME_FRACTION_PERCENT=95
XRT_COMPOSITOR_USE_PRESENT_WAIT=1

# --- this setup specifically ---
# Basalt 2.1.0 that matches Monado's VIT 2.1 header (driver dlopens it by name).
# The lib dir differs per distro (lib64, lib/<multiarch>, lib) and environment.d cannot detect it:
# scripts/install.sh rewrites this line to the real Basalt lib dir under the install prefix.
VIT_SYSTEM_LIBRARY_PATH=${HOME}/.local/lib64/libbasalt.so
# refresh left at the driver default (90 Hz for Crystal Super); P3C ignores XRT_COMPOSITOR_DESIRED_MODE
# Proton 11 / Steam Linux Runtime need this to see the OpenXR runtime
PRESSURE_VESSEL_IMPORT_OPENXR_1_RUNTIMES=1
# canted panels: report parallel views to the app so the eyes line up
OXR_PARALLEL_VIEWS=1