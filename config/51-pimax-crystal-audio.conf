# Pimax Crystal Super built-in audio: a USB audio chip (USB 3654:5678) behind the headset's internal hub.
# Install to ~/.config/wireplumber/wireplumber.conf.d/ and restart WirePlumber (systemctl --user restart wireplumber).
#
# Its ALSA card is named "USB Audio" like several onboard USB codecs, and the UCM profile of such a codec can be
# applied to it, so its sinks end up pointing at the wrong card. Plain ALSA profiles (no UCM) fix the mapping.
# The card is matched by USB vendor/product id, its nodes by the chip's name; other USB audio devices with the
# same chip would match too.
monitor.alsa.rules = [
  {
    matches = [ { device.vendor.id = "0x3654", device.product.id = "0x5678", media.class = "Audio/Device" } ]
    actions = {
      update-props = {
        api.alsa.use-ucm = false
        device.description = "Pimax Crystal Super"
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_output.usb-JieLi_Technology_USB_Audio.*" } ]
    actions = { update-props = { node.description = "Pimax Crystal Super Speakers" } }
  }
  {
    matches = [ { node.name = "~alsa_input.usb-JieLi_Technology_USB_Audio.*" } ]
    actions = { update-props = { node.description = "Pimax Crystal Super Input" } }
  }
]
