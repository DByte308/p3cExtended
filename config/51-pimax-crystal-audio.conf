# Pimax Crystal Super built-in audio:
# 1. USB 34a4:0040 (Pimax Crystal Super): DMAS speakers are on ALSA device 1 (hw:X,1), while device 0 is capture-only.
#    PipeWire's default ACP profile only checks device 0 and picks mic-only (0 sinks), hiding the speakers.
#    Selecting "pro-audio" exposes the speaker output (pro-output-1) and mic automatically.
# 2. USB 3654:5678 (JieLi audio chip behind the headset hub on Crystal / Crystal Light): its ALSA card is named
#    "USB Audio" like several onboard USB codecs, and a motherboard UCM profile can steal it. Plain ALSA profiles
#    (api.alsa.use-ucm = false) fix the mapping.
# Install to ~/.config/wireplumber/wireplumber.conf.d/ and restart WirePlumber (systemctl --user restart wireplumber).
monitor.alsa.rules = [
  {
    matches = [ { device.vendor.id = "0x34a4", device.product.id = "0x0040", media.class = "Audio/Device" } ]
    actions = {
      update-props = {
        device.profile = "pro-audio"
        device.description = "Pimax Crystal Super"
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_output.usb-Pimax_Corporation_Pimax_Crystal_Super.*" } ]
    actions = { update-props = { node.description = "Pimax Crystal Super DMAS Speakers" } }
  }
  {
    matches = [ { node.name = "~alsa_input.usb-Pimax_Corporation_Pimax_Crystal_Super.*" } ]
    actions = { update-props = { node.description = "Pimax Crystal Super Microphone" } }
  }
  {
    matches = [ { device.vendor.id = "0x3654", device.product.id = "0x5678", media.class = "Audio/Device" } ]
    actions = {
      update-props = {
        api.alsa.use-ucm = false
        device.description = "Pimax Crystal Audio"
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_output.usb-JieLi_Technology_USB_Audio.*" } ]
    actions = { update-props = { node.description = "Pimax Crystal Speakers (USB Audio)" } }
  }
  {
    matches = [ { node.name = "~alsa_input.usb-JieLi_Technology_USB_Audio.*" } ]
    actions = { update-props = { node.description = "Pimax Crystal Input (USB Audio)" } }
  }
]
